# O job olist_pipeline (11 tarefas):
#
#   raw_conferencia
#     └── bronze_ingestao
#           └── silver_clientes, silver_pedidos, silver_produtos_vendedores,
#               silver_itens_pagamentos_avaliacoes, silver_geolocalizacao
#               (rodam em paralelo, todas dependem só de bronze_ingestao)
#                 └── gold_dimensoes
#                       └── gold_fato_vendas
#                             └── gold_marts
#                                   ├── testes (obrigatório, derruba o job se falhar)
#                                   └── metricas_de_negocio
#
# raw_conferencia confere que os 9 CSVs chegaram ao Volume bronze.raw.
# bronze_ingestao só roda se a conferência passar: a ordem é o conteúdo.
# As 5 tarefas silver rodam em paralelo porque nenhuma depende da outra.
# gold_dimensoes → fato_vendas → marts é sequencial: cada uma lê o que a
# anterior escreveu. Depois de marts, duas cadeias em paralelo: testes (a
# última linha de defesa numérica) e metricas_de_negocio (as views de
# negócio consumidas por dashboard/Genie).

resources:
  jobs:
    olist_pipeline:
      name: olist_pipeline

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql
              source: WORKSPACE

        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql
              source: WORKSPACE

        - task_key: silver_produtos_vendedores
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-produtos-vendedores.sql
              source: WORKSPACE

        - task_key: silver_itens_pagamentos_avaliacoes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-itens-pagamentos-avaliacoes.sql
              source: WORKSPACE

        - task_key: silver_geolocalizacao
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/05-geolocalizacao.sql
              source: WORKSPACE

        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_produtos_vendedores
            - task_key: silver_itens_pagamentos_avaliacoes
            - task_key: silver_geolocalizacao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-dimensoes.sql
              source: WORKSPACE

        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-fato-vendas.sql
              source: WORKSPACE

        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-marts.sql
              source: WORKSPACE

        - task_key: testes
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/09-testes.sql
              source: WORKSPACE

        - task_key: metricas_de_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/10-metricas-negocio.sql
              source: WORKSPACE
