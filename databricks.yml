# Databricks Asset Bundle para o projeto olist.
# Pipeline medalhão (raw -> bronze -> silver -> gold) sobre o dataset
# público "Brazilian E-Commerce" da Olist.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: olist

include:
  - resources/*.yml

# O repositório git raiz (Documentos) ignora esta pasta inteira via
# /Projetos/* no .gitignore de nível superior. Sem isso, o `bundle deploy`
# não sincroniza nenhum arquivo (usa o git para decidir o que subir).
sync:
  include:
    - "**"

variables:
  catalog:
    description: Catálogo Unity Catalog usado por este bundle
    default: lakehouse_olist
  warehouse_id:
    description: SQL Warehouse serverless usado para queries e para o script de criação do catálogo
    default: 7c3ea71f9ae30d85

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-604bc86c-0b09.cloud.databricks.com
    variables:
      catalog: lakehouse_olist
      warehouse_id: 7c3ea71f9ae30d85
    # ARMADILHA IMPORTANTE: NÃO use `mode: development` aqui. Ele prefixa o
    # nome dos recursos com [dev seu_usuario] — inclusive os SCHEMAS do Unity
    # Catalog, que virariam dev_fulano_bronze e quebrariam todo o SQL (que
    # referencia lakehouse_olist.bronze.*). Em vez disso, pausamos o
    # agendamento explicitamente.
    presets:
      trigger_pause_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://dbc-604bc86c-0b09.cloud.databricks.com
      root_path: /Workspace/Users/juliobarro@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_olist
      warehouse_id: 7c3ea71f9ae30d85
    permissions:
      - user_name: juliobarro@gmail.com
        level: CAN_MANAGE
